<section id="achievements" class="py-20 px-4 bg-pink-900/20 backdrop-blur">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold mb-12 text-center">
      <span class="bg-gradient-to-r from-yellow-300 to-pink-300 bg-clip-text text-black">Achievements & Certifications</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div *ngFor="let achievement of achievements"
           class="bg-pink-900/30 p-6 rounded-lg border border-slate-600 hover:border-yellow-300 transition group">

        <!-- Icon -->
        <div class="text-5xl mb-4 group-hover:scale-110 transition">
          {{ achievement.icon }}
        </div>

        <!-- Content -->
        <h3 class="text-lg font-bold text-black mb-2">{{ achievement.title }}</h3>
        <p class="text-black text-sm mb-3">{{ achievement.description }}</p>
        <span class="text-xs text-black">{{ achievement.date }}</span>
      </div>
    </div>
  </div>
</section>
