<section id="achievements" class="py-20 px-4 bg-white dark:bg-slate-900">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold mb-12 text-center">
      <span class="bg-gradient-to-r from-yellow-500 to-pink-500 bg-clip-text text-transparent">Achievements & Certifications</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div *ngFor="let achievement of achievements"
           class="bg-slate-50 dark:bg-slate-800 p-6 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-yellow-400 dark:hover:border-yellow-500 transition group">

        <!-- Icon -->
        <div class="text-5xl mb-4 group-hover:scale-110 transition">
          {{ achievement.icon }}
        </div>

        <!-- Content -->
        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">{{ achievement.title }}</h3>
        <p class="text-slate-600 dark:text-slate-300 text-sm mb-3">{{ achievement.description }}</p>
        <span class="text-xs text-slate-500 dark:text-slate-400">{{ achievement.date }}</span>
      </div>
    </div>
  </div>
</section>
