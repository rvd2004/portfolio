<section id="skills" class="py-20 px-4 bg-slate-50 dark:bg-slate-800">
  <div class="max-w-5xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold mb-12 text-center">
      <span class="bg-gradient-to-r from-yellow-500 to-pink-500 bg-clip-text text-transparent">Technical Skills</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div *ngFor="let category of categories">
        <h3 class="text-xl font-semibold text-slate-900 dark:text-white mb-6 flex items-center">
          <span class="w-2 h-2 bg-gradient-to-r from-yellow-500 to-pink-500 rounded-full mr-3"></span>
          {{ category }}
        </h3>

        <div class="space-y-4">
          <div *ngFor="let skill of getSkillsByCategory(category)" class="space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-slate-900 dark:text-white font-medium">{{ skill.name }}</span>
              <span class="text-slate-600 dark:text-slate-400 text-sm">{{ skill.level }}%</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
              <div class="bg-gradient-to-r from-yellow-400 to-pink-400 h-full rounded-full transition-all duration-500"
                   [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Additional Skills -->
    <div class="mt-12 bg-slate-100 dark:bg-slate-700 p-6 rounded-lg border border-slate-200 dark:border-slate-600">
      <h3 class="text-xl font-semibold text-slate-900 dark:text-white mb-4">Core Competencies</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="flex items-center">
          <span class="text-yellow-500 mr-3">✓</span>
          <span class="text-slate-700 dark:text-slate-300">OOP Principles</span>
        </div>
        <div class="flex items-center">
          <span class="text-yellow-500 mr-3">✓</span>
          <span class="text-slate-700 dark:text-slate-300">Design Patterns</span>
        </div>
        <div class="flex items-center">
          <span class="text-yellow-500 mr-3">✓</span>
          <span class="text-slate-700 dark:text-slate-300">Microservices</span>
        </div>
        <div class="flex items-center">
          <span class="text-yellow-500 mr-3">✓</span>
          <span class="text-slate-700 dark:text-slate-300">Unit Testing</span>
        </div>
      </div>
    </div>
  </div>
</section>
