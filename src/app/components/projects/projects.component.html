<section id="projects" class="py-20 px-4 bg-slate-50 dark:bg-slate-800">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold mb-12 text-center">
      <span class="bg-gradient-to-r from-yellow-500 to-pink-500 bg-clip-text text-transparent">Featured Projects</span>
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div *ngFor="let project of projects"
           class="bg-white dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 overflow-hidden hover:border-yellow-400 dark:hover:border-yellow-500 transition group">

        <!-- Project Image/Icon -->
        <div class="h-48 bg-gradient-to-br from-slate-100 dark:from-slate-600 to-slate-200 dark:to-slate-700 flex items-center justify-center text-6xl group-hover:scale-110 transition">
          {{ project.image }}
        </div>

        <!-- Project Content -->
        <div class="p-6">
          <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">{{ project.title }}</h3>

          <p class="text-slate-600 dark:text-slate-300 mb-4 leading-relaxed h-20 overflow-hidden">
            {{ project.description }}
          </p>

          <!-- Technologies -->
          <div class="flex flex-wrap gap-2 mb-6">
            <span *ngFor="let tech of project.technologies"
                  class="px-3 py-1 bg-slate-100 dark:bg-slate-600 border border-slate-300 dark:border-slate-500 text-slate-700 dark:text-slate-300 text-xs rounded-full hover:border-yellow-400 dark:hover:border-yellow-500 transition">
              {{ tech }}
            </span>
          </div>

          <!-- Links -->
          <div class="flex gap-3">
            <button *ngIf="project.liveLink"
                    (click)="openLink(project.liveLink)"
                    class="flex-1 px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-semibold rounded-lg transition transform hover:scale-105">
              Live Demo
            </button>
            <button *ngIf="project.githubLink"
                    (click)="openLink(project.githubLink)"
                    class="flex-1 px-4 py-2 bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 text-slate-900 dark:text-white font-semibold rounded-lg transition transform hover:scale-105 border border-slate-400 dark:border-slate-500">
              GitHub
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
